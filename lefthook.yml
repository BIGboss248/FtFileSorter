pre-commit:
  parallel: false
  commands:
    formatting:
      run: dart format --set-exit-if-changed .
    analysis:
      run: flutter analyze --fatal-infos

commit-msg:
  parallel: false
  commands:
    lint-commit:
      run: dart run commitlint_cli --edit {1}

pre-push:
  parallel: false
  commands:
    tests:
      run: flutter test
